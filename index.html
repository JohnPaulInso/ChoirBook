<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- (2026-07-13) lock viewport so topbar stays fixed; prev: maximum-scale=5 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songbook">
<title>My Songbook</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">

<!-- Preconnect + fonts (falls back to system fonts instantly if offline; swap for self-hosted fonts before Capacitor build if you want zero network dependency) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">

<!-- Firebase (compat SDK — simplest to use with no build step). Safe to load even
     before you've filled in firebase-config.js: the app just stays in local/offline
     mode until real config values + sign-in are present. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
</head>
<body>
  <div id="app"><div class="loading">Loading your songs&hellip;</div></div>
  <script src="./app.js"></script>
</body>
</html>
